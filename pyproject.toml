[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landscape-ctrl"
version = "0.1.0"
description = "CLI + API client for Canonical Landscape MDM — control and interact with managed devices from your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gkelley" }]
keywords = ["landscape", "mdm", "canonical", "ubuntu", "cli", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.27",        # async-capable HTTP client with SSL support
    "typer>=0.12",        # CLI framework (Click-based, fully typed)
    "pydantic>=2.0",      # response model validation and serialization
    "rich>=13.0",         # tables, colors, spinners, progress bars
    "tomli>=2.0; python_version < '3.11'",  # TOML parsing (stdlib in 3.11+)
    "tomli-w>=1.0",       # TOML writing (not in stdlib)
    "keyring>=24.0",      # OS keychain storage for secrets
    "platformdirs>=4.0",  # cross-platform config/data/cache dirs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",       # mock httpx HTTP calls in tests
    "ruff>=0.4",         # linting + formatting
    "mypy>=1.10",        # static type checking
    "hatch>=1.12",
]

[project.scripts]
lsctl = "landscape_ctrl.cli.main:app"

[project.urls]
Repository = "https://github.com/gkelley/landscape-ctrl"

[tool.hatch.build.targets.wheel]
packages = ["src/landscape_ctrl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/landscape_ctrl"]
omit = ["tests/*"]
